[package]
name = "xmip-core-contract-toon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract-toon"
description = "TOON content contract: Token-Oriented Object Notation, well-formed always, conforming to a bound JSON Schema when a Location names one. A xmip-core-contract technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
stream = { workspace = true, optional = true }

# TOON is a notation for the JSON data model, and a bound schema is a JSON
# Schema: the sibling that reads them evaluates the parsed value (ADR-0044: a
# technology leans on the technology it is a notation of, never copies it).
contract_json_schema = { workspace = true, optional = true }

# The JSON value model the parser produces and the schema is read through —
# the same crate the sibling's API is stated in.
serde_json = { version = "1", optional = true }

[features]
# The code and its declaration: the contract guide,
# module/core/capability/contract/doc/adding-a-contract.md.
default = [
    "declaration", "dep:contract", "dep:stream", "dep:contract_json_schema", "dep:serde_json",
]
# The declaration alone.
declaration = []

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
